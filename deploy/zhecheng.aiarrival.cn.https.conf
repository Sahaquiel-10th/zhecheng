server {
    listen 80;
    listen [::]:80;
    server_name zhecheng.aiarrival.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/zhecheng.aiarrival.cn/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://zhecheng.aiarrival.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zhecheng.aiarrival.cn;
    root /var/www/zhecheng.aiarrival.cn/current;
    index index.html;
    charset utf-8;
    ssl_certificate /etc/letsencrypt/live/zhecheng.aiarrival.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhecheng.aiarrival.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ZhechengTLS:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    access_log /var/log/nginx/zhecheng.aiarrival.cn.access.log;
    error_log /var/log/nginx/zhecheng.aiarrival.cn.error.log;
    add_header X-Content-Type-Options nosniff always;
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Zhecheng-Site "catalog" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1h;
    }
    location ~ /\. { deny all; }
}
