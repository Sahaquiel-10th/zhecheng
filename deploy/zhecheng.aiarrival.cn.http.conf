# HTTP bootstrap only. HTTPS configuration follows after checking existing certificates.
# Add this as an independent file in the server's verified Nginx include directory.
server {
    listen 80;
    listen [::]:80;
    server_name zhecheng.aiarrival.cn;

    root /var/www/zhecheng.aiarrival.cn/current;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/zhecheng.aiarrival.cn.access.log;
    error_log /var/log/nginx/zhecheng.aiarrival.cn.error.log;
    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1h;
    }

    location ~ /\. {
        deny all;
    }
}
