# HTTP bootstrap only. HTTPS configuration follows after checking existing certificates.
# Install after existing sites as sites-enabled/zz-zhecheng.aiarrival.cn.conf.
server {
    listen 80;
    listen [::]:80;
    server_name zhecheng.aiarrival.cn;

    root /var/www/zhecheng.aiarrival.cn/current;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/zhecheng.aiarrival.cn.access.log;
    error_log /var/log/nginx/zhecheng.aiarrival.cn.error.log;
    add_header X-Content-Type-Options nosniff always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/zhecheng.aiarrival.cn/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Zhecheng-Site "catalog" always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1h;
    }

    location ~ /\. {
        deny all;
    }
}
