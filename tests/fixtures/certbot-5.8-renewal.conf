version = 5.8.0
archive_dir = /etc/letsencrypt/archive/zhecheng.aiarrival.cn
cert = /etc/letsencrypt/live/zhecheng.aiarrival.cn/cert.pem
privkey = /etc/letsencrypt/live/zhecheng.aiarrival.cn/privkey.pem
chain = /etc/letsencrypt/live/zhecheng.aiarrival.cn/chain.pem
fullchain = /etc/letsencrypt/live/zhecheng.aiarrival.cn/fullchain.pem

[renewalparams]
account = fixture-account
authenticator = webroot
server = https://acme-v02.api.letsencrypt.org/directory
key_type = ecdsa
webroot_path = /var/www/zhecheng.aiarrival.cn/acme,
renew_hook = /usr/local/libexec/zhecheng/renew-nginx.sh
[[webroot_map]]
zhecheng.aiarrival.cn = /var/www/zhecheng.aiarrival.cn/acme
